##############################################################################
#  Intégration continue — Daghoip Ikassa
#
#  Trois travaux indépendants, exécutés en parallèle :
#
#    qualite   typage, lint, format, tests unitaires, build de production
#    sql       migrations et suites de tests SQL sur un PostgreSQL réel
#    docker    construction de l'image, pour ne pas découvrir au déploiement
#              qu'elle ne se construit plus
#
#  Le build de production a besoin des variables `NEXT_PUBLIC_*`, inlinées dans
#  le bundle client. On utilise des valeurs factices : rien n'est appelé au
#  build, et cela évite de faire dépendre la CI d'un projet Supabase réel — ou
#  d'exposer une clé dans les journaux d'un dépôt public.
##############################################################################

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # Appelable par un autre workflow. `deploiement.yml` s'en sert pour ne rien
  # publier qui n'ait pas d'abord passé les mêmes contrôles — dupliquer les
  # étapes ici et là-bas les aurait fatalement laissées diverger, et c'est
  # toujours la copie du déploiement qui s'allège.
  workflow_call:

# Une seule exécution par branche : pousser trois fois de suite ne doit pas
# occuper trois runners pour un résultat qui sera de toute façon écrasé.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  qualite:
    name: Qualité et build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-anonyme-factice-pour-la-construction
      NEXT_PUBLIC_SITE_URL: https://exemple.ga

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Typage
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Tests unitaires
        run: npm run test:unit

      - name: Tests de composants
        run: npm run test:ui

      - name: Build de production
        run: npm run build

      - name: Budget de poids
        # Après le build, forcément : le script mesure ce que le build a produit.
        # Un dépassement fait échouer la CI — un budget qui se contente
        # d'avertir n'est pas un budget, c'est une statistique qu'on ignore.
        run: npm run verify:perf

  sql:
    name: Migrations et tests SQL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Installer PostgreSQL 16 et ses extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-contrib-16

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        # Le runner compare aussi le typage TypeScript au schéma réel : il a
        # besoin du compilateur, donc des dépendances.
        run: npm ci

      - name: Rejouer les migrations, les suites de tests et la conformité du typage
        # Le script démarre son propre serveur jetable : il ne doit pas tourner
        # en root, `initdb` le refuse. `NODE_BIN` est transmis explicitement —
        # le `node` du PATH de `pgtest` n'est pas celui qu'a installé
        # `setup-node`, et une version trop ancienne ferait échouer le
        # dépouillement de types sur un message incompréhensible.
        run: |
          sudo useradd -m pgtest || true
          sudo chmod -R a+rX .
          sudo -u pgtest env PATH="/usr/lib/postgresql/16/bin:$PATH" \
            NODE_BIN="$(command -v node)" \
            PGDATA=/tmp/pgdata-ci ./supabase/tests/run.sh

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Le cache d'Actions évite de réinstaller node_modules à chaque
          # exécution : sans lui, ce travail dure trois fois plus longtemps.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://exemple.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=cle-anonyme-factice-pour-la-construction
            NEXT_PUBLIC_SITE_URL=https://exemple.ga
